name: Playwright Tests

# Runs only the logged-out ("unauthenticated") tests. Tests that need a Salesforce login
# (*.auth.spec.ts) are excluded in CI by playwright.config.ts, and no Salesforce
# credentials or saved session are used here.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

# One run per branch/PR at a time; a new push cancels the older run of the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches local development (Node 24); Playwright 1.64 needs Node 20 or newer.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Install Playwright browser (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (unauthenticated project only)
        run: npm run test:ci

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results (JUnit XML and failure evidence)
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
